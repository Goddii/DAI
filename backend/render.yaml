# Render Blueprint for the Dai backend.
#
# Applies:  render blueprint launch  (or connect this repo in the Render dashboard)
#
# After creation:
#   1. Replace CORS_ORIGINS below with the deployed frontend URL
#      (e.g. https://dai.vercel.app).
#   2. Set DATABASE_URL in the Render dashboard to the Supabase PostgreSQL
#      connection string (postgresql://... — postgres:// is also accepted and
#      normalized). It is an externally supplied secret: never commit it.
#   3. The migrations run automatically in the pre-deploy (release) step —
#      never on worker startup.
#   4. SECRET_KEY / JWT_SECRET_KEY are auto-generated by Render. The app
#      refuses to boot (fail-closed) if any required secret — including
#      DATABASE_URL — is missing.
#   5. There is no auto-seeding. To add the demo trader on demand:
#      render shell <service-name> -- flask --app run.py seed

services:
  - type: web
    name: dai-api
    runtime: python
    plan: free
    # Commands run from the backend/ directory of the repository, so
    # requirements.txt, run.py and migrations/ resolve correctly.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - run:app
    preDeployCommand: flask --app run.py db upgrade
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES
        value: "2592000"
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND-DOMAIN.example