name: Migrate Neon database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate database secret
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Add the NEON_DATABASE_URL repository secret before running this workflow."
            exit 1
          fi

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: flask --app run.py db upgrade

      - name: Verify migration revision
        run: flask --app run.py db current
